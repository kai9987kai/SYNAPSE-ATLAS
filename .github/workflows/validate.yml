name: Validate research bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pure analysis cores
        run: node --test source/*.test.cjs
      - name: Verify captured source data offline
        run: python tools/verify-source-data.py
      - name: Rebuild the standalone app
        run: python tools/build-standalone.py --output rebuilt/index.html
      - name: Verify captured build bytes
        run: python tools/verify-source-data.py --built-html rebuilt/index.html
